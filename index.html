<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GodRust</title>
</head>
<body style="margin:0;background:#0a0a0c;color:#c9a84c;font:14px/1.4 system-ui;padding:1rem">
<p id="s">Loading GodRust…</p>
<script>
(async function () {
  try {
    var r = await fetch("godrust.b64", { cache: "no-store" });
    if (!r.ok) throw new Error("fetch " + r.status);
    var t = await r.text();
    var html = atob(t.replace(/\s/g, ""));
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.getElementById("s").textContent = "Load failed: " + e + " — use email GODRUST.html via Files then Share to Chrome.";
  }
})();
</script>
</body>
</html>
